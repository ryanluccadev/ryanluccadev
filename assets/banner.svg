<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617">
        <animate attributeName="stop-color"
          values="#020617;#0a1a3f;#020617"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0b3d91">
        <animate attributeName="stop-color"
          values="#0b3d91;#1e6fd9;#0b3d91"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#020617">
        <animate attributeName="stop-color"
          values="#020617;#0a1a3f;#020617"
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b9dff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b9dff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Grade sutil de "circuito" -->
  <g stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="1050" y1="0" x2="1050" y2="300"/>
  </g>

  <!-- Partículas flutuantes -->
  <g fill="#60a5fa">
    <circle cx="120" cy="60" r="3">
      <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="230" r="4">
      <animate attributeName="cy" values="230;255;230" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="240" r="2.5">
      <animate attributeName="cy" values="240;215;240" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="55" r="3.5">
      <animate attributeName="cy" values="55;80;55" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="35" r="2">
      <animate attributeName="cy" values="35;20;35" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="180" r="2.5">
      <animate attributeName="cx" values="60;90;60" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="150" r="3">
      <animate attributeName="cx" values="1140;1110;1140" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Simbolo de codigo decorativo -->
  <text x="90" y="150" font-family="'Courier New', monospace" font-size="42" fill="#3b82f6" opacity="0.18" filter="url(#softBlur)">&lt;/&gt;</text>
  <text x="1000" y="180" font-family="'Courier New', monospace" font-size="34" fill="#3b82f6" opacity="0.15" filter="url(#softBlur)">{ }</text>

  <!-- Nome -->
  <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">
    Ryan Lucca
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <!-- Linha decorativa animada abaixo do nome -->
  <rect x="500" y="172" width="200" height="3" rx="1.5" fill="#3b9dff">
    <animate attributeName="width" values="0;200;200" dur="1.6s" fill="freeze"/>
    <animate attributeName="x" values="600;500;500" dur="1.6s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0.4;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitulo -->
  <text x="600" y="215" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="1.5" fill="#9dc4ff">
    Desenvolvedor de Software em Formação
  </text>

</svg>
